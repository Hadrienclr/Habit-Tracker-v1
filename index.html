*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
#root{height:100%;}
.shell{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);}
.hdr{padding:10px 16px 0;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:8px 16px 150px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}
.tabs{position:fixed;bottom:0;left:0;right:0;padding:6px 6px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,15,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b);display:flex;gap:2px;z-index:50;}

.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:9px;font-weight:600;color:var(--t3);transition:all .2s;}
.tb.on{background:var(--green3);color:var(--green2);}
.tc{animation:tcIn .26s cubic-bezier(.22,1,.36,1);}
@keyframes tcIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
.clbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;}
.pb{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px;}
.pf{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1);}
.pb.t{height:9px;}
.gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.gr span{font-size:12px;color:var(--t2);}
.sban{margin-top:8px;padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:11px;color:var(--green2);text-align:center;}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.nbtn{background:var(--s);border:1px solid var(--b);color:var(--t);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
.vpill{display:flex;background:var(--s);border-radius:8px;padding:2px;gap:2px;}
.vbtn{padding:4px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--t3);display:flex;align-items:center;gap:3px;}
.vbtn.on{background:var(--green3);color:var(--green2);}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
.cdl{text-align:center;font-size:10px;font-weight:600;color:var(--t3);padding:3px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:11px;font-weight:500;user-select:none;opacity:0;animation:cPop forwards;}
.day.td{border-color:rgba(34,197,94,0.6)!important;}
.day.future{opacity:0.2!important;cursor:default!important;pointer-events:none;}
.dot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#a855f7;}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.wday{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:10px 2px;cursor:pointer;border:1.5px solid transparent;user-select:none;}
.wday.td{border-color:rgba(34,197,94,0.6)!important;}
.wday.future{opacity:0.2;cursor:default;pointer-events:none;}

.ym-name{font-size:10px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
.ym-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;}
.yd{aspect-ratio:1;border-radius:2px;}
.organ-flip{perspective:900px;height:130px;cursor:pointer;}
.organ-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}

.organ-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--b);background:var(--bg2);}
.organ-front{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;overflow:hidden;}
.organ-back{transform:rotateY(180deg);background:var(--bg3);padding:12px;display:flex;flex-direction:column;justify-content:space-between;}

.rec-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:200;display:flex;align-items:flex-end;animation:moFade .2s ease;}

.mh{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 14px;cursor:pointer;}
.mo-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:moFade .2s ease;}

.slbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:8px;}

.toggle{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;flex-shrink:0;}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on{background:var(--green);}
.toggle.on::after{transform:translateX(18px);}
.toggle.off{background:var(--b2);}
.badge-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border:1px solid transparent;}
.badge-item.earned{background:var(--green3);border-color:rgba(34,197,94,0.18);}
.badge-item.locked{opacity:.35;}
.badge-cat{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;}

.ob-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 24px;}
.ob-footer{padding:14px 24px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-shrink:0;}
.ob-slide{animation:tcIn .25s cubic-bezier(.22,1,.36,1);}
.drug-sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.drug-sel-item{border:1.5px solid var(--b);border-radius:12px;padding:10px;cursor:pointer;background:var(--s);display:flex;align-items:center;gap:8px;}
.drug-sel-item.on{background:var(--green3);border-color:rgba(34,197,94,0.4);}
.field-lbl{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.field-in{width:100%;background:var(--s);border:1.5px solid var(--b);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--t);font-family:inherit;outline:none;}
.ss{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}

.ss .m .v{font-size:15px;font-weight:700;}
.ss .m .l{font-size:9px;color:var(--t3);margin-top:1px;}
.flip-card{perspective:1000px;cursor:pointer;}
.flip-inner{position:relative;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:14px;border:1px solid var(--b);}

.help-num:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
</style>

// ── Logic helpers ─────────────────────────────────────────────────────────────
function isClean(e,act){
  if(!e)return false;
  if(e.clean)return true;
  if(!e.logged)return false;
  return Object.keys(act).filter(k=>act[k]).every(k=>(e[k]||0)===0);
}
function dColor(e,act){
  if(!e)return null;
  if(isClean(e,act))return"#22c55e";
  const u=Object.keys(act).filter(k=>act[k]&&(e[k]||0)>0);
  if(!u.length)return null;
  if(u.length>=3)return"#9f1239";
  if(u.length===2)return"#ef4444";
  return DRUGS[u[0]]?.color||"#6b7280";
}
function dEmoji(e,act){
  if(!e)return"·";
  if(isClean(e,act))return"✦";
  const u=Object.keys(act).filter(k=>act[k]&&(e[k]||0)>0);
  if(!u.length)return"·";
  if(u.length>=3)return"💀";
  if(u.length===2)return"⚠";
  return DRUGS[u[0]]?.emoji||"·";
}
function calcScore(streak,longest,pct,dCount,logged,act){
  if(dCount===0)return 0;
  const active=Object.keys(act).filter(k=>act[k]);
  const maxD=active.length>0?Math.max(...active.map(k=>SEV[k]||90)):90;
  return Math.round(pct*0.45+Math.min((streak/maxD)*100,100)*0.3+Math.min((longest/maxD)*100,100)*0.15+Math.min(logged/dCount*100,100)*0.1);
}
function getLevel(streak,act){
  const active=Object.keys(act).filter(k=>act[k]);
  if(!active.length)return{n:1,label:"Debut",color:"#6b7280",pct:0,maxDays:90};
  const maxDays=Math.max(...active.map(k=>SEV[k]||90));
  const pct=Math.min((streak/maxDays)*100,100);
  if(pct>=100)return{n:5,label:"Maitrise",color:"#a855f7",pct:100,maxDays};
  if(pct>=66)return{n:4,label:"En force",color:"#22c55e",pct,maxDays};
  if(pct>=33)return{n:3,label:"En chemin",color:"#4ade80",pct,maxDays};
  if(pct>=10)return{n:2,label:"Depart",color:"#f97316",pct,maxDays};
  return{n:1,label:"Debut",color:"#6b7280",pct,maxDays};
}
function calcMoney(entries,goals,act){
  let total=0;const details=[];
  Object.keys(act).filter(k=>act[k]).forEach(k=>{
    if(k==="porno")return;
    if(k==="tabac"){
      const cpd=(goals.cigPerDay||20)/20*(goals.cigPackCost||10);
      const n=entries.filter(x=>x.e?.logged&&(x.e?.tabac||0)===0).length;
      const s=n*cpd;if(s>0){details.push({emoji:"🚬",name:"Tabac",saved:s.toFixed(2)});total+=s;}
    } else if(k==="cannabis"){
      const cpd=(goals.jointsPerDay||1)*(goals.weedGPerJoint||0.3)*(goals.weedGCost||15);
      const n=entries.filter(x=>x.e?.logged&&(x.e?.cannabis||0)===0).length;
      const s=n*cpd;if(s>0){details.push({emoji:"🍃",name:"Cannabis",saved:s.toFixed(2)});total+=s;}
    } else {
      const freq=goals[k+"_freq"]||0;const cost=goals[k+"_cost"]||DCOST[k]||10;
      if(freq>0){
        const n=entries.filter(x=>x.e?.logged&&(x.e?.[k]||0)===0).length;
        const s=n*(freq/7)*cost;if(s>0){details.push({emoji:DRUGS[k]?.emoji||"",name:DRUGS[k]?.name||k,saved:s.toFixed(2)});total+=s;}
      }
    }
  });
  return{total:total.toFixed(2),details};
}

function useSwipe(onL,onR){
  const r=useRef(null);
  useEffect(()=>{
    const el=r.current;if(!el)return;
    let sx=0,sy=0;
    const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;};
    const te=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)*1.4&&Math.abs(dx)>40){if(dx<0)onL();else onR();}};
    el.addEventListener("touchstart",ts,{passive:true});el.addEventListener("touchend",te,{passive:true});
    return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};
  },[onL,onR]);
  return r;
}

  const path=pts.map((pt,i)=>(i===0?"M ":"L ")+pt.x+" "+pt.y).join(" ");

  function handle(cx){const rect=svgRef.current?.getBoundingClientRect();if(!rect)return;const x=(cx-rect.left)*(W/rect.width);const i=Math.max(0,Math.min(Math.round(((x-p)/(W-p*2))*(spark.length-1)),spark.length-1));setTip({i,pt:pts[i],px:(pts[i].x/W)*rect.width});}

// ── PieStats ──────────────────────────────────────────────────────────────────
function PieStats({data,act,aList}){
  const today=new Date();
  const days30=Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return data[k]||null;
  });
  function Pie({cleanD,consoD,total,color,name,emoji}){
    if(total===0)return null;
    const r=36,cx=50,cy=50;
    const cPct=cleanD/total,csPct=consoD/total;
    function arc(startP,p,col){
      if(p<=0)return null;
      const s=startP*2*Math.PI-Math.PI/2,e=(startP+p)*2*Math.PI-Math.PI/2;
      const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
      return <path d={"M "+cx+" "+cy+" L "+x1+" "+y1+" A "+r+" "+r+" 0 "+(p>0.5?"1":"0")+" 1 "+x2+" "+y2+" Z"} fill={col}/>;
    }
    return <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
      <svg width={80} height={80} viewBox="0 0 100 100" style={{flexShrink:0}}>
        <circle cx={cx} cy={cy} r={r} fill="var(--s2)"/>
        {arc(0,cPct,"#22c55e")}
        {arc(cPct,csPct,color)}
        {arc(cPct+csPct,1-cPct-csPct,"var(--b2)")}
        <circle cx={cx} cy={cy} r={22} fill="var(--bg2)"/>
        <text x={cx} y={cy-4} textAnchor="middle" fontSize="14" fontWeight="700" fill="#22c55e">{Math.round(cPct*100)}%</text>
        <text x={cx} y={cy+10} textAnchor="middle" fontSize="8" fill="var(--t3)">clean</text>
      </svg>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><span style={{fontSize:16}}>{emoji}</span><span style={{fontSize:12,fontWeight:600,color:"var(--t)"}}>{name}</span></div>
        <div style={{fontSize:11,color:"var(--t2)",marginBottom:2}}>{cleanD}j clean sur 30</div>
        {consoD>0&&<div style={{fontSize:11,color:color}}>{consoD}j avec consommation</div>}
      </div>
    </div>;
  }
  const clean30=days30.filter(e=>e&&isClean(e,act)).length;
  const conso30=days30.filter(e=>e&&!isClean(e,act)&&e.logged).length;
  return <div>
    <Pie cleanD={clean30} consoD={conso30} total={30} color="#f97316" name="Ensemble" emoji="✦"/>
    {aList.map(k=>{
      const cD=days30.filter(e=>e&&e.logged&&(e[k]||0)===0).length;
      const csD=days30.filter(e=>e&&(e[k]||0)>0).length;
      return <Pie key={k} cleanD={cD} consoD={csD} total={30} color={DRUGS[k]?.color||"#888"} name={DRUGS[k]?.name||k} emoji={DRUGS[k]?.emoji||""}/>;
    })}
    <div style={{fontSize:10,color:"var(--t3)",textAlign:"center",marginTop:4}}>Basé sur les 30 derniers jours</div>
  </div>;
}

}

// ── MainApp ───────────────────────────────────────────────────────────────────
function MainApp(){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [data,setData]=useState(()=>ld(ST,{}));
  const [goals,setGoals]=useState(()=>ld(GT,{target:20,notifOn:false,notifTime:"22:00",cigPerDay:20,cigPackCost:10,jointsPerDay:1,weedGPerJoint:0.3,weedGCost:15}));
  const [act,setAct]=useState(()=>ld(DT,DEF_ACT));
  const [profile,setProfile]=useState(()=>ld(PT,{name:"",photo:null}));
  const [widgets,setWidgets]=useState(()=>ld(WT,DEF_WDG));
  const [tab,setTab]=useState("cal");
  const [calView,setCalView]=useState("month");
  const [weekOff,setWeekOff]=useState(0);
  const [modal,setModal]=useState(null);
  const [calKey,setCalKey]=useState(0);
  const [expand,setExpand]=useState(null);
  const [showProfile,setShowProfile]=useState(false);
  const [showWidgets,setShowWidgets]=useState(false);
  const [showLevel,setShowLevel]=useState(false);
  const [showSevrage,setShowSevrage]=useState(false);
  const [helpDrug,setHelpDrug]=useState(null);
  const [pulse,setPulse]=useState(false);
  const prevStreak=useRef(0);
  const sevrageShown=useRef(ld("ht_sev_shown",false));

  useEffect(()=>{sv(ST,data);},[data]);
  useEffect(()=>{sv(GT,goals);},[goals]);
  useEffect(()=>{sv(DT,act);},[act]);
  useEffect(()=>{sv(PT,profile);},[profile]);
  useEffect(()=>{sv(WT,widgets);},[widgets]);

  // ── Computed values (all before any conditional return) ───────────────────
  const aList=useMemo(()=>Object.keys(act).filter(k=>act[k]),[act]);
  const dCount=dIn(year,month),offset=fOff(year,month);
  const entries=useMemo(()=>Array.from({length:dCount},(_,i)=>{const e=data[dk(year,month,i+1)]||null;return{d:i+1,e,clean:isClean(e,act)};}), [data,year,month,dCount,act]);
  const logged=entries.filter(x=>x.e?.logged).length;
  const nClean=entries.filter(x=>x.clean).length;
  const pct=logged?Math.round((nClean/logged)*100):0;
  const totals=useMemo(()=>{const t={};aList.forEach(k=>{t[k]=entries.reduce((s,x)=>s+(x.e?.[k]||0),0);});return t;},[entries,aList]);
  const [streak,longest]=useMemo(()=>{
    let s=0,cur=new Date(today);
    while(true){const k=dk(cur.getFullYear(),cur.getMonth(),cur.getDate());if(isClean(data[k],act)){s++;cur.setDate(cur.getDate()-1);}else break;}
    let lg=0,run=0,pd=null;
    for(const k of Object.keys(data).sort()){if(isClean(data[k],act)){const d=new Date(k);if(pd&&(d-pd)/86400000===1){run++;}else{run=1;}lg=Math.max(lg,run);pd=d;}else{run=0;pd=null;}}
    return[s,lg];
  },[data,act]);
  useEffect(()=>{
    if(streak>prevStreak.current){
      setPulse(true);setTimeout(()=>setPulse(false),600);
      if(!sevrageShown.current){
        const active=Object.keys(act).filter(k=>act[k]);
        if(active.length>0){
          const maxDays=Math.max(...active.map(k=>SEV[k]||90));
          if(streak>=maxDays){setShowSevrage(true);sevrageShown.current=true;sv("ht_sev_shown",true);}
        }
      }
    }
    prevStreak.current=streak;
  },[streak,act]);
  const sc=calcScore(streak,longest,pct,dCount,logged,act);
  const scColor=sc>=70?"#22c55e":sc>=40?"#f97316":"#ef4444";
  const lv=getLevel(streak,act);
  const badges=useMemo(()=>calcBadges(data,act),[data,act]);
  const earnedCount=badges.filter(b=>b.earned).length;
  const allLogged=Object.values(data).filter(e=>e?.logged).length;
  const money=useMemo(()=>calcMoney(entries,goals,act),[entries,goals,act]);
  const spark=useMemo(()=>Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=dk(d.getFullYear(),d.getMonth(),d.getDate());
    const e=data[k],cl=isClean(e,act);
    const tot=e?aList.reduce((s,dr)=>s+(e[dr]||0),0):0;
    return{v:cl?3:tot===0?2:tot<=2?1:0,color:cl?"#22c55e":tot===0?"var(--t3)":"#ef4444",label:d.getDate()+" "+MONTHS_S[d.getMonth()]+" - "+(cl?"Clean":tot===0?"Non renseigne":tot+" prise(s)")};
  }),[data,act,aList]);

  // ── Calendar helpers ─────────────────────────────────────────────────────
  const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=dCount;d++)cells.push(d);while(cells.length%7!==0)cells.push(null);
  function getWD(off){
    const base=new Date(today);const dow=base.getDay()===0?6:base.getDay()-1;base.setDate(base.getDate()-dow+off*7);
    return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return{date:d,key:dk(d.getFullYear(),d.getMonth(),d.getDate())};});
  }
  const weekDays=getWD(weekOff);
  const prevM=useCallback(()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);setCalKey(k=>k+1);},[month]);
  const nextM=useCallback(()=>{const nm=month===11?0:month+1;const ny=month===11?year+1:year;if(ny>today.getFullYear()||(ny===today.getFullYear()&&nm>today.getMonth()))return;if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);setCalKey(k=>k+1);},[month,year]);
  const mSwipe=useSwipe(nextM,prevM);
  const wSwipe=useSwipe(()=>setWeekOff(w=>w+1),()=>setWeekOff(w=>w-1));
  const ySwipe=useSwipe(()=>setYear(y=>Math.min(y+1,today.getFullYear())),()=>setYear(y=>y-1));
  function saveEntry(key,d){setData(prev=>({...prev,[key]:d}));}
  function clearEntry(key){setData(prev=>{const n={...prev};delete n[key];return n;});}
  const rOrder={"Extreme":0,"Tres eleve":1,"Eleve":2,"Modere":3,"Faible":4,"Comportemental":5};
  const sortedDrugs=Object.entries(DRUGS).sort((a,b)=>(rOrder[a[1].risk]||9)-(rOrder[b[1].risk]||9));
  const enabledW=widgets.filter(w=>w.on);

  // ── Render ───────────────────────────────────────────────────────────────
  return <div className="shell">
    <div className="hdr">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div>
          <div style={{fontSize:9,letterSpacing:".15em",color:"var(--t3)",textTransform:"uppercase",fontWeight:600}}>Mon parcours</div>
          <h1 style={{fontSize:18,fontWeight:700,color:"var(--t)",lineHeight:1.1,letterSpacing:"-.02em"}}>Habit Tracker{profile.name?" · "+profile.name:""}</h1>
        </div>
        <button onClick={()=>setShowProfile(true)} style={{width:34,height:34,borderRadius:"50%",background:"var(--s)",border:"1px solid var(--b)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,color:"var(--t2)"}}>
          {profile.photo?<img src={profile.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<IcUser/>}
        </button>
      </div>
    </div>

    <div className="content">

    {/* ═══ PARCOURS ═══ */}
    {tab==="cal"&&<div className="tc">
      <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))",cursor:"pointer"}} onClick={()=>setShowLevel(true)}>

            <div style={{marginTop:10}}><Bar pct={sc} color={"linear-gradient(90deg,"+scColor+","+scColor+"88)"} thick/></div>
          </div>
          <div style={{paddingLeft:16}}><Flame streak={streak}/></div>

      </div>

      <div className="nav">
        <button className="nbtn" onClick={calView==="year"?()=>setYear(y=>y-1):calView==="week"?()=>setWeekOff(w=>w-1):prevM}>‹</button>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <span style={{fontSize:13,fontWeight:600}}>{calView==="year"?year:calView==="week"?weekDays[0].date.getDate()+"-"+weekDays[6].date.getDate()+" "+MONTHS_S[weekDays[3].date.getMonth()]:MONTHS[month]+" "+year}</span>
          <div className="vpill">
            <button className={"vbtn"+(calView==="month"?" on":"")} onClick={()=>setCalView("month")}><IcMo/>Mois</button>
            <button className={"vbtn"+(calView==="week"?" on":"")} onClick={()=>setCalView("week")}><IcSe/>Sem.</button>

          </div>

        <button className="nbtn" onClick={calView==="year"?()=>setYear(y=>Math.min(y+1,today.getFullYear())):calView==="week"?()=>setWeekOff(w=>w+1):nextM}>›</button>

      {calView==="month"&&<div ref={mSwipe} style={{touchAction:"pan-y"}}>

        <div className="cal-grid" key={calKey}>
          {cells.map((d,i)=>{

              <span style={{fontSize:11,fontWeight:iT?700:500}}>{d}</span>

            return <div key={key} className={"wday"+(iT?" td":"")+(future?" future":"")} style={{background:col?col+"18":"var(--s)",borderColor:col||(iT?"rgba(34,197,94,0.6)":"transparent")}} onClick={()=>!future&&setModal({y:date.getFullYear(),m:date.getMonth(),d:date.getDate()})}>

              <div style={{fontSize:14,fontWeight:700,color:col||(iT?"var(--green2)":"var(--t)"),marginBottom:2}}>{date.getDate()}</div>

      </div>
      <div className="ss" style={{marginTop:10}}>
