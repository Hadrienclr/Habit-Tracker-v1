<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme:dark)"/>
  <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme:light)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Habit Tracker"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <title>Habit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0a0a0f;--bg2:#12121c;--bg3:#1a1a28;
      --s:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);
      --b:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.14);
      --t:#e8e8f0;--t2:#9ca3af;--t3:#6b7280;
      --green:#22c55e;--green2:#4ade80;--green3:rgba(34,197,94,0.12);
      --sh:0 2px 16px rgba(0,0,0,0.35);
    }
    @media(prefers-color-scheme:light){:root{
      --bg:#f0f4f8;--bg2:#ffffff;--bg3:#e8edf4;
      --s:rgba(0,0,0,0.04);--s2:rgba(0,0,0,0.08);
      --b:rgba(0,0,0,0.08);--b2:rgba(0,0,0,0.14);
      --t:#0f172a;--t2:#475569;--t3:#94a3b8;
      --green:#16a34a;--green2:#15803d;--green3:rgba(22,163,74,0.1);
      --sh:0 2px 12px rgba(0,0,0,0.08);
    }}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
    #root{height:100%;}
    .shell{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);}
    .hdr{padding:10px 16px 0;flex-shrink:0;}
    .content{flex:1;overflow-y:auto;padding:8px 16px 160px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .content::-webkit-scrollbar{display:none;}
    .tabs{position:fixed;bottom:0;left:0;right:0;padding:6px 6px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,15,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b);display:flex;gap:2px;z-index:50;}
    @media(prefers-color-scheme:light){.tabs{background:rgba(240,244,248,0.96);}}
    .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:9px;font-weight:600;color:var(--t3);transition:color .2s ease,background .2s ease;}
    .tb.on{background:var(--green3);color:var(--green2);}
    .tb svg{transition:transform .28s cubic-bezier(.22,1,.36,1);}
    .tb.on svg{transform:scale(1.1);}
    .tc{animation:tcIn .26s cubic-bezier(.22,1,.36,1);}
    @keyframes tcIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .card{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
    .xcard{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;position:relative;box-shadow:var(--sh);}
    .xbtn{position:absolute;top:11px;right:11px;background:var(--s);border:1px solid var(--b);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .clbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;}
    .pb{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px;}
    .pf{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1);}
    .pb.t{height:9px;}
    .gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
    .gr span{font-size:12px;color:var(--t2);}
    .sban{margin-top:8px;padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:11px;color:var(--green2);text-align:center;}
    .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .nbtn{background:var(--s);border:1px solid var(--b);color:var(--t);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .14s,transform .14s;}
    .nbtn:active{background:var(--s2);transform:scale(0.88);}
    .vpill{display:flex;background:var(--s);border-radius:8px;padding:2px;gap:2px;}
    .vbtn{padding:4px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--t3);transition:all .18s;display:flex;align-items:center;gap:3px;}
    .vbtn.on{background:var(--green3);color:var(--green2);}
    .cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
    .cdl{text-align:center;font-size:10px;font-weight:600;color:var(--t3);padding:3px 0;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:11px;font-weight:500;user-select:none;opacity:0;animation:cPop forwards;transition:transform .14s,background .2s,border-color .2s;}
    .day:active{transform:scale(0.87)!important;}
    .day.td{border-color:rgba(34,197,94,0.6)!important;}
    .day.bop{animation:cBop .36s cubic-bezier(.34,1.56,.64,1) forwards!important;}
    .day.future{opacity:0.2!important;cursor:default!important;pointer-events:none;}
    .dot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#a855f7;}
    @keyframes cPop{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
    @keyframes cBop{0%{transform:scale(1)}35%{transform:scale(1.26)}65%{transform:scale(0.93)}100%{transform:scale(1)}}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
    .wday{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:10px 2px;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:transform .14s,background .2s;}
    .wday:active{transform:scale(0.92);}
    .wday.td{border-color:rgba(34,197,94,0.6)!important;}
    .wday.future{opacity:0.2;cursor:default;pointer-events:none;}
    .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .ym-card{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:8px 6px;cursor:pointer;transition:all .15s;}
    .ym-card:active{transform:scale(0.96);}
    .ym-name{font-size:10px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
    .ym-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;}
    .yd{aspect-ratio:1;border-radius:2px;}
    .organ-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
    .organ-flip{perspective:900px;height:140px;cursor:pointer;}
    .organ-flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
    .organ-flip.flipped .organ-flip-inner{transform:rotateY(180deg);}
    .organ-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--b);background:var(--bg2);box-shadow:var(--sh);}
    .organ-front{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;}
    .organ-back-face{transform:rotateY(180deg);background:var(--bg3);padding:10px 11px;display:flex;flex-direction:column;justify-content:space-between;}
    .organ-pb{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:4px;width:100%;}
    .organ-pf{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}
    .flip-hint{position:absolute;top:7px;right:8px;opacity:0.3;color:var(--t3);}
    .level-modal{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:moFade .2s ease;}
    .level-box{background:var(--bg2);border:1px solid var(--b);border-radius:20px;padding:24px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;}
    .level-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);}
    .level-row:last-child{border-bottom:none;}
    .milestone-card{background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(168,85,247,0.06));border:1px solid rgba(34,197,94,0.25);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;}
    .mg{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.2),transparent);pointer-events:none;}
    .drug-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
    .drug-tab{padding:4px 10px;border-radius:20px;border:1px solid var(--b);background:var(--s);color:var(--t3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;}
    .drug-tab.on{border-color:currentColor;}
    .rec-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}

    .mo{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:200;display:flex;align-items:flex-end;animation:moFade .2s ease;}
    @keyframes moFade{from{opacity:0}to{opacity:1}}
    .mb{background:var(--bg2);border:1px solid var(--b);border-radius:22px 22px 0 0;padding:18px 15px;padding-bottom:max(24px,calc(16px + env(safe-area-inset-bottom,0px)));width:100%;animation:mbSlide .3s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto;}
    @keyframes mbSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .mh{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 14px;cursor:pointer;}
    .ctr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;margin-bottom:6px;}
    .ctr-row.active{border-color:currentColor;}
    .ctr-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
    .ctr-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
    .ctr-lbl{font-size:13px;font-weight:500;}
    .ctr-sub{font-size:10px;color:var(--t3);margin-top:1px;}
    .ctr-right{display:flex;align-items:center;flex-shrink:0;}
    .ctr-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--b2);background:var(--s);color:var(--t);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
    .ctr-btn:active{background:var(--s2);}
    .ctr-val{min-width:36px;text-align:center;font-size:17px;font-weight:700;}
    .slbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:8px;}
    .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
    .tag{padding:5px 10px;border-radius:18px;border:1px solid var(--b);background:var(--s);font-size:11px;font-weight:500;cursor:pointer;color:var(--t3);transition:all .15s;}
    .tag.on{background:var(--green3);border-color:rgba(34,197,94,0.35);color:var(--green2);}
    .mood-row{display:flex;gap:5px;margin-bottom:10px;}
    .mood-btn{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid transparent;background:var(--s);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .18s;}
    .mood-btn.on{border-color:currentColor;}
    .mood-btn span:first-child{font-size:18px;}
    .mood-btn span:last-child{font-size:9px;font-weight:600;}
    textarea{background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:inherit;font-size:16px;padding:9px;width:100%;outline:none;resize:none;transition:border-color .2s;}
    textarea:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"],input[type="time"],input[type="text"]{background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--t);font-family:inherit;font-size:16px;padding:7px 9px;outline:none;transition:border-color .2s;}
    input:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"]{width:88px;}
    input[type="time"]{width:auto;}
    .bprim{width:100%;padding:13px;border-radius:11px;background:rgba(34,197,94,0.15);border:1.5px solid rgba(34,197,94,0.3);color:var(--green2);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px;transition:background .18s;}
    .bprim:active{background:rgba(34,197,94,0.25);}
    .leg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px;}
    .li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--t3);}
    .ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .ss{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}
    .ss .m{background:var(--bg2);border:1px solid var(--b);border-radius:9px;padding:8px 4px;text-align:center;}
    .ss .m .v{font-size:15px;font-weight:700;}
    .ss .m .l{font-size:9px;color:var(--t3);margin-top:1px;}
    .drug-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;border:1.5px solid transparent;margin-bottom:7px;cursor:pointer;background:var(--s);transition:all .18s;}
    .drug-chip.on{background:var(--green3);border-color:rgba(34,197,94,0.25);}
    .toggle{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
    .toggle.on{background:var(--green);}.toggle.on::after{transform:translateX(18px);}
    .toggle.off{background:var(--b2);}
    .badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border:1px solid transparent;}
    .badge.earned{background:var(--green3);border-color:rgba(34,197,94,0.18);}
    .badge.locked{opacity:.35;}
    .badge-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
    .badge-name{font-size:12px;font-weight:600;}
    .badge-desc{font-size:10px;color:var(--t3);margin-top:1px;}
    .badge-cat{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;padding-left:2px;}
    .exp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:300;display:flex;flex-direction:column;animation:moFade .22s ease;padding:env(safe-area-inset-top,16px) 14px 16px;}
    @media(prefers-color-scheme:light){.exp-overlay{background:rgba(240,244,248,0.97);}}
    .exp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .exp-title{font-size:16px;font-weight:600;color:var(--t);}
    .exp-close{background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--t);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .exp-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    .chart-tip{position:absolute;background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;pointer-events:none;z-index:10;white-space:nowrap;box-shadow:var(--sh);color:var(--t);}
    .flame-svg{animation:fw 2s ease-in-out infinite;}
    @keyframes fw{0%,100%{transform:scaleY(1) scaleX(1)}25%{transform:scaleY(1.06) scaleX(0.97)}75%{transform:scaleY(0.96) scaleX(1.03)}}
    .social-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--b);background:var(--s);cursor:pointer;margin-bottom:8px;width:100%;font-family:inherit;font-size:13px;font-weight:500;color:var(--t);transition:background .15s;}
    .social-btn:active{background:var(--s2);}
    .profile-avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid rgba(34,197,94,0.4);}
    .avatar-icon{width:68px;height:68px;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--t2);}
    .wdg-item{background:var(--bg2);border:1px solid var(--b);border-radius:13px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);touch-action:none;user-select:none;transition:border-color .15s,background .15s,opacity .15s;}
    .wdg-item.over{border-color:var(--green);background:var(--green3);}
    .level-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;margin-top:4px;}
    /* Onboarding */
    .ob-wrap{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);}
    .ob-progress{padding:14px 24px 0;flex-shrink:0;}
    .ob-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 24px;}
    .ob-footer{padding:14px 24px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-shrink:0;}
    .ob-slide{animation:tcIn .25s cubic-bezier(.22,1,.36,1);}
    .drug-sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
    .drug-sel-item{border:1.5px solid var(--b);border-radius:12px;padding:10px;cursor:pointer;background:var(--s);display:flex;align-items:center;gap:8px;transition:all .15s;}
    .drug-sel-item.on{background:var(--green3);border-color:rgba(34,197,94,0.4);}
    .field-label{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
    .field-input{width:100%;background:var(--s);border:1.5px solid var(--b);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--t);font-family:inherit;outline:none;transition:border-color .2s;}
    .field-input:focus{border-color:rgba(34,197,94,0.5);}
    @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

// ── Durées médicales sevrage ──────────────────────────────────────────────────
const SEV={tabac:90,cannabis:90,alcool:180,cocaine:180,mdma:365,amphet:180,heroine:365,ketamine:180,lsd:30,champi:14,crack:180,benzo:180,meth:730,poppers:7,ghb:30,proto:90,porno:180};

// ── Coût par défaut / prise ───────────────────────────────────────────────────
const DEF_COST={alcool:3,cocaine:10,mdma:15,amphet:10,heroine:30,ketamine:20,lsd:15,champi:20,crack:25,benzo:2,meth:30,poppers:5,ghb:8,proto:2};

// ── Base drogues ──────────────────────────────────────────────────────────────
const DRUGS={
  tabac:{name:"Tabac",emoji:"🚬",color:"#f97316",risk:"Élevé",riskColor:"#f97316",unit:"cigarettes",unitShort:"cig",on:true,

function score(streak,longest,pct,nClean,dCount,logged,act){
  if(dCount===0)return 0;
  const active=Object.keys(act).filter(k=>act[k]);
  const maxD=active.length>0?Math.max(...active.map(k=>SEV[k]||90)):90;
  return Math.round(pct*0.45+Math.min((streak/maxD)*100,100)*0.3+Math.min((longest/maxD)*100,100)*0.15+Math.min((logged/dCount)*100,100)*0.1);
}
function getLevel(streak,act){
  const active=Object.keys(act).filter(k=>act[k]);
  if(!active.length)return{n:1,label:"Début",color:"#6b7280",pct:0,maxDays:90};
  const maxDays=Math.max(...active.map(k=>SEV[k]||90));
  const pct=Math.min((streak/maxDays)*100,100);
  if(pct>=100)return{n:5,label:"Maîtrise ✦",color:"#a855f7",pct:100,maxDays};
  if(pct>=66)return{n:4,label:"En force",color:"#22c55e",pct,maxDays};

  if(pct>=10)return{n:2,label:"Départ",color:"#f97316",pct,maxDays};
  return{n:1,label:"Début",color:"#6b7280",pct,maxDays};
}

// ── Composant FactCard avec effet typewriter ──────────────────────────────────
function FactCard({streak,act}){
  const [displayed,setDisplayed]=useState('');
  const [factIdx,setFactIdx]=useState(0);
  const timerRef=useRef(null);
  const charRef=useRef(0);

  // Choisir un fait adapté au streak
  const getFact=useCallback(()=>{
    // Facts spécifiques au streak
    const byStreak=streak>=365?[0,14,16,30]:streak>=90?[8,9,14,15]:streak>=30?[7,11,12,13]:streak>=14?[6,11,18,24]:streak>=7?[4,5,9,23]:streak>=3?[2,3,20,21]:[17,27,28,29];
    const pool=[...byStreak,...Array.from({length:5},(_,i)=>Math.floor(Math.random()*FACTS.length))];
    return pool[factIdx%pool.length];
  },[streak,factIdx]);

  useEffect(()=>{
    const idx=getFact();
    const text=FACTS[idx%FACTS.length];
    charRef.current=0;
    setDisplayed('');
    clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>{
      charRef.current++;
      setDisplayed(text.slice(0,charRef.current));
      if(charRef.current>=text.length) clearInterval(timerRef.current);
    },28);
    return()=>clearInterval(timerRef.current);
  },[factIdx,streak]);

  return<div className="card" style={{background:"var(--green3)",border:"1px solid rgba(34,197,94,0.2)",cursor:"pointer"}} onClick={()=>setFactIdx(f=>f+1)}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
      <div style={{fontSize:9,color:"var(--green)",fontWeight:700,letterSpacing:".08em",textTransform:"uppercase"}}>Fait éducatif</div>
      <div style={{fontSize:9,color:"var(--green2)",opacity:0.7}}>Tap pour suivant →</div>
    </div>
    <p style={{fontSize:12,color:"var(--t)",lineHeight:1.6,fontStyle:"italic",minHeight:36}}>{displayed}<span style={{opacity:0.5,animation:"blink 1s infinite"}}>|</span></p>
  </div>;
}



// ── PieStats — camembert SVG par drogue ──────────────────────────────────────
function PieStats({data,act,aList}){
  const today=new Date();
  // Calculer sur les 30 derniers jours
  const days30=Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    return data[k]||null;
  });
  const logged30=days30.filter(Boolean).length;
  const clean30=days30.filter(e=>e&&isClean(e,act)).length;
  const conso30={};
  aList.forEach(k=>{conso30[k]=days30.filter(e=>e&&(e[k]||0)>0).length;});

  function PieChart({cleanDays,consoDays,total,color,name,emoji}){
    if(total===0)return<div style={{textAlign:"center",color:"var(--t3)",fontSize:11}}>Pas de données</div>;
    const r=38,cx=50,cy=50,circ=2*Math.PI*r;
    const cleanPct=cleanDays/total;
    const consoPct=consoDays/total;
    const restPct=1-cleanPct-consoPct;
    // Arcs SVG
    function arc(startPct,pct,col){
      if(pct<=0)return null;
      const s=startPct*2*Math.PI-Math.PI/2;
      const e=(startPct+pct)*2*Math.PI-Math.PI/2;
      const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s);
      const x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
      const large=pct>0.5?1:0;
      return<path d={`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`} fill={col}/>;
    }
    return<div style={{display:"flex",alignItems:"center",gap:14}}>
      <svg width={80} height={80} viewBox="0 0 100 100" style={{flexShrink:0}}>
        <circle cx={cx} cy={cy} r={r} fill="var(--s2)"/>
        {arc(0,cleanPct,"#22c55e")}
        {arc(cleanPct,consoPct,color)}
        {arc(cleanPct+consoPct,restPct,"var(--b2)")}
        <circle cx={cx} cy={cy} r={22} fill="var(--bg2)"/>
        <text x={cx} y={cy-5} textAnchor="middle" fontSize="14" fontWeight="700" fill="#22c55e">{Math.round(cleanPct*100)}%</text>
        <text x={cx} y={cy+10} textAnchor="middle" fontSize="9" fill="var(--t3)">clean</text>
      </svg>
      <div style={{flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}><span style={{fontSize:16}}>{emoji}</span><span style={{fontSize:13,fontWeight:600,color:"var(--t)"}}>{name}</span></div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}>
          <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:"#22c55e",flexShrink:0}}/><span style={{fontSize:11,color:"var(--t2)"}}>{cleanDays}j clean sur 30</span></div>
          {consoDays>0&&<div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:color,flexShrink:0}}/><span style={{fontSize:11,color:"var(--t2)"}}>{consoDays}j avec consommation</span></div>}
          <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:"var(--b2)",flexShrink:0}}/><span style={{fontSize:11,color:"var(--t3)"}}>{total-cleanDays-consoDays}j non renseignés</span></div>
        </div>
      </div>
    </div>;
  }

  return<div style={{display:"flex",flexDirection:"column",gap:14}}>
    <PieChart cleanDays={clean30} consoDays={logged30-clean30} total={30} color="#f97316" name="Ensemble" emoji="✦"/>
    {aList.map(k=>{
      const d=DRUGS[k];
      const consoDays30=days30.filter(e=>e&&(e[k]||0)>0).length;
      const cleanDays30=days30.filter(e=>e&&isClean(e,act)&&(e[k]||0)===0&&e.logged).length;
      return<PieChart key={k} cleanDays={days30.filter(e=>e&&e.logged&&(e[k]||0)===0).length} consoDays={consoDays30} total={30} color={d.color} name={d.name} emoji={d.emoji}/>;
    })}
    <div style={{fontSize:10,color:"var(--t3)",textAlign:"center"}}>Basé sur les 30 derniers jours</div>
  </div>;
}

function ExpandView({title,onClose,children}){return<div className="exp-overlay"><div className="exp-hdr"><div className="exp-title">{title}</div><button className="exp-close" onClick={onClose}><IcX/></button></div><div className="exp-body">{children}</div></div>;}
function useSwipe(onL,onR){const r=useRef(null);useEffect(()=>{const el=r.current;if(!el)return;let sx=0,sy=0;const ts=e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;};const te=e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy)*1.4&&Math.abs(dx)>40){if(dx<0)onL();else onR();}};el.addEventListener("touchstart",ts,{passive:true});el.addEventListener("touchend",te,{passive:true});return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};},[onL,onR]);return r;}

// ── Next Milestone ────────────────────────────────────────────────────────────
function Milestone({streak,act}){
  const [open,setOpen]=useState(false);
  const primary=Object.keys(act).find(k=>act[k]&&DRUGS[k]?.rec?.length>0);
  if(!primary)return null;
  const steps=DRUGS[primary].rec,d=DRUGS[primary];
  const next=steps.find(s=>s.days>streak),prev=steps.filter(s=>s.days<=streak).pop();
  const pct=next?(prev?Math.round(((streak-prev.days)/(next.days-prev.days))*100):Math.round((streak/Math.max(next.days,1))*100)):100;
  const left=next?next.days-streak:0;
  const allActive=Object.keys(act).filter(k=>act[k]&&DRUGS[k]?.rec?.length>0);
  return<>

            <div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}>{d.name} · <span style={{color:d.color,fontWeight:600}}>{left} jour{left>1?"s":""}</span></div>
          </div>
          <div style={{fontSize:9,color:"var(--green2)",opacity:0.7,flexShrink:0,marginLeft:8}}>Voir tout →</div>

    {open&&<div className="mo" onClick={()=>setOpen(false)}>

          return<div key={k} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid var(--b)"}}>

          </div>;
        })}

    </div>}
  </>;
}

// ── Chart ─────────────────────────────────────────────────────────────────────
function Chart({spark}){
  const [tip,setTip]=useState(null);const svgRef=useRef(null);
  const W=300,H=90,p=8,mx=Math.max(...spark.map(d=>d.v),1);
  const pts=spark.map((d,i)=>({x:p+(i/Math.max(spark.length-1,1))*(W-p*2),y:H-p-(d.v/mx)*(H-p*2),c:d.color||"#22c55e",label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
  function handle(cx){const rect=svgRef.current?.getBoundingClientRect();if(!rect)return;const x=(cx-rect.left)*(W/rect.width);const i=Math.max(0,Math.min(Math.round(((x-p)/(W-p*2))*(spark.length-1)),spark.length-1));setTip({i,pt:pts[i],px:(pts[i].x/W)*rect.width});}
  return<div style={{position:"relative"}}>
    {tip&&<div className="chart-tip" style={{left:Math.min(Math.max(tip.px-55,0),200),top:-28,color:tip.pt.c}}>{tip.pt.label}</div>}
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,touchAction:"none"}} onTouchStart={e=>handle(e.touches[0].clientX)} onTouchMove={e=>handle(e.touches[0].clientX)} onTouchEnd={()=>setTimeout(()=>setTip(null),2500)} onClick={e=>handle(e.clientX)}>
      <defs><linearGradient id="cg9" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity=".28"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#cg9)"/>
      <path d={path} fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {[0.33,0.66].map(f=>{const y=H-p-f*(H-p*2);return<line key={f} x1={p} y1={y} x2={W-p} y2={y} stroke="var(--b)" strokeWidth="1" strokeDasharray="3,3"/>;})}
      {pts.map((p,i)=>tip?.i===i?<circle key={i} cx={p.x} cy={p.y} r={5} fill={p.c} stroke="var(--bg2)" strokeWidth="2"/>:<circle key={i} cx={p.x} cy={p.y} r={2} fill={p.c} stroke="var(--bg2)" strokeWidth="1.5"/>)}
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}><span style={{fontSize:9,color:"var(--t3)"}}>Il y a 30j</span><span style={{fontSize:9,color:"var(--t3)"}}>Aujourd'hui</span></div>
  </div>;
}

// ── Widget Manager ────────────────────────────────────────────────────────────
function WidgetMgr({widgets,setWidgets,onClose}){
  const [items,setItems]=useState(()=>[...widgets]);
  const dragIdx=useRef(null);const overIdx=useRef(null);const listRef=useRef(null);
  function save(){setWidgets(items);onClose();}
  function onTS(i,e){dragIdx.current=i;e.currentTarget.classList.add("dragging");}
  function onTM(e){e.preventDefault();const touch=e.touches[0];const els=listRef.current?.querySelectorAll(".wdg-item");if(!els)return;let found=-1;els.forEach((el,i)=>{el.classList.remove("over");const r=el.getBoundingClientRect();if(touch.clientY>=r.top&&touch.clientY<=r.bottom){found=i;el.classList.add("over");}});overIdx.current=found>=0?found:overIdx.current;}
  function onTE(){const from=dragIdx.current,to=overIdx.current;const els=listRef.current?.querySelectorAll(".wdg-item");if(els)els.forEach(el=>{el.classList.remove("dragging","over");});if(from!==null&&to!==null&&from!==to){const arr=[...items];const item=arr.splice(from,1)[0];arr.splice(to,0,item);setItems(arr);}dragIdx.current=null;overIdx.current=null;}
  return<div className="mo" onClick={onClose}>
    <div className="mb" onClick={e=>e.stopPropagation()}>
      <div className="mh" onClick={onClose}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:600,color:"var(--t)"}}>Personnaliser l'accueil</div>
        <button onClick={save} style={{background:"var(--green3)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:8,padding:"5px 14px",color:"var(--green2)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>OK</button>
      </div>
      <div style={{fontSize:11,color:"var(--t3)",marginBottom:12}}>Maintiens et glisse · Bascule pour activer</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}} ref={listRef}>
        {items.map((w,i)=><div key={w.id} className="wdg-item" onTouchStart={e=>onTS(i,e)} onTouchMove={onTM} onTouchEnd={onTE} draggable onDragStart={()=>{dragIdx.current=i;}} onDragOver={e=>{e.preventDefault();overIdx.current=i;}} onDragEnd={()=>{const from=dragIdx.current,to=overIdx.current;if(from!==null&&to!==null&&from!==to){const arr=[...items];const item=arr.splice(from,1)[0];arr.splice(to,0,item);setItems(arr);}dragIdx.current=null;overIdx.current=null;}}>
          <div style={{color:"var(--t3)",flexShrink:0}}><IcGrip/></div>
          <div style={{flex:1,fontSize:13,fontWeight:500,color:"var(--t)"}}>{w.label}</div>
          <button className={`toggle${w.enabled?" on":" off"}`} onClick={e=>{e.stopPropagation();setItems(prev=>prev.map((x,j)=>j===i?{...x,enabled:!x.enabled}:x));}}/>
        </div>)}
      </div>
    </div>
  </div>;
}

// ── Onboarding ────────────────────────────────────────────────────────────────
function Onboarding({onComplete}){
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [age,setAge]=useState("");
  const [photo,setPhoto]=useState(null);
  const [selDrugs,setSelDrugs]=useState({});
  const [goalsL,setGoalsL]=useState({cigPerDay:20,cigPackCost:10,jointsPerDay:1,weedGPerJoint:0.3,weedGCost:15});
  const [otherC,setOtherC]=useState({});
  const [obWarningDrug,setObWarningDrug]=useState(null);
  const fileRef=useRef(null);
  const quote=useRef(QUOTES[Math.floor(Math.random()*QUOTES.length)]);

  const drugList=Object.keys(selDrugs).filter(k=>selDrugs[k]);
  const hasCig=selDrugs.tabac,hasWeed=selDrugs.cannabis;
  const hasOther=drugList.filter(k=>k!=="tabac"&&k!=="cannabis").length>0;
  const steps=["welcome","name","drugs",hasCig?"cig":null,hasWeed?"weed":null,hasOther?"other":null,"done"].filter(Boolean);
  const cur=steps[step];
  const total=steps.length;
  const canNext=cur==="name"?name.trim().length>0:cur==="drugs"?drugList.length>0:true;

  function next(){if(step<total-1)setStep(s=>s+1);}
  function prev(){if(step>0)setStep(s=>s-1);}
  function handlePhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>setPhoto(ev.target.result);r.readAsDataURL(f);}

  function finish(){
    const ad=Object.fromEntries(Object.keys(DRUGS).map(k=>[k,!!selDrugs[k]]));
    const g={...goalsL,target:20,notifOn:false,notifTime:"22:00"};
    drugList.filter(k=>k!=="tabac"&&k!=="cannabis").forEach(k=>{g[`${k}_cost`]=otherC[`${k}_cost`]||DEF_COST[k]||10;g[`${k}_freq`]=otherC[`${k}_freq`]||0;});
    onComplete({name,age,photo,activeDrugs:ad,goals:g});
  }

  const riskOrder={"Extrême":0,"Très élevé":1,"Élevé":2,"Modéré":3,"Faible":4};
  const sortedDrugs=Object.entries(DRUGS).sort((a,b)=>(riskOrder[a[1].risk]||9)-(riskOrder[b[1].risk]||9));

  function renderStep(){
    switch(cur){

        <div className="ob-slide" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",minHeight:"100%",paddingTop:24}}>

          <h1 style={{fontSize:26,fontWeight:700,color:"var(--t)",marginBottom:12,lineHeight:1.2}}>Bienvenue sur<br/>Habit Tracker</h1>
          <p style={{fontSize:14,color:"var(--t2)",lineHeight:1.7,marginBottom:20}}>Ton outil personnel pour un parcours de progression sur-mesure.</p>
          <div style={{background:"var(--s)",border:"1px solid var(--b)",borderRadius:14,padding:"16px 18px",marginBottom:20,width:"100%"}}>
            <p style={{fontSize:13,color:"var(--t)",lineHeight:1.7,fontStyle:"italic"}}>"{quote.current}"</p>
          </div>
          <p style={{fontSize:12,color:"var(--t3)",lineHeight:1.6}}>On crée ton profil en 2 minutes pour que tout soit adapté à toi.</p>
        </div>
      );
      case "name":return(
        <div className="ob-slide" style={{paddingTop:32}}>
          {/* Photo en haut centrée */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:32}}>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto}/>
            <div onClick={()=>fileRef.current?.click()} style={{position:"relative",cursor:"pointer",marginBottom:10}}>
              {photo
                ?<img src={photo} alt="" style={{width:88,height:88,borderRadius:"50%",objectFit:"cover",border:"3px solid var(--green)",boxShadow:"0 0 0 6px rgba(34,197,94,0.12)"}}/>
                :<div style={{width:88,height:88,borderRadius:"50%",background:"linear-gradient(135deg,var(--s2),var(--bg3))",border:"2px dashed rgba(34,197,94,0.4)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5}}>
                  <svg width={24} height={24} viewBox="0 0 24 24" fill="none" stroke="rgba(34,197,94,0.7)" strokeWidth="1.5" strokeLinecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <span style={{fontSize:9,color:"rgba(34,197,94,0.7)",fontWeight:600}}>PHOTO</span>
                </div>}
              <div style={{position:"absolute",bottom:2,right:2,width:24,height:24,borderRadius:"50%",background:"var(--green)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.3)"}}>
                <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

            <div style={{fontSize:11,fontWeight:600,color:"#fb923c",marginBottom:4}}>ℹ️ Information</div>
            <p style={{fontSize:11,color:"var(--t3)",lineHeight:1.6}}>Cet outil est éducatif et ne remplace pas un avis médical. En cas de dépendance sévère, contacte un professionnel ou le <strong style={{color:"var(--t2)"}}>0 800 23 13 13</strong> (Drogues Info Service, gratuit 24h/24).</p>

              <span style={{fontSize:18}}>{DRUGS[k]?.emoji}</span>
              <span style={{fontSize:13,fontWeight:500,color:"var(--t)",flex:1}}>{DRUGS[k]?.name}</span>
              <span style={{fontSize:11,color:"var(--green2)",fontWeight:600}}>{SEV[k]}j</span>
            </div>)}
          </div>
        </div>
      );
      default:return null;
    }
  }

  return<div className="ob-wrap">
    {obWarningDrug&&<div className="mo" onClick={()=>setObWarningDrug(null)}>
      <div className="mb" onClick={e=>e.stopPropagation()}>
        <div className="mh" onClick={()=>setObWarningDrug(null)}/>
        <div style={{textAlign:"center",marginBottom:14}}>
          <div style={{fontSize:32,marginBottom:6}}>{DRUGS[obWarningDrug]?.emoji}</div>
          <div style={{fontSize:15,fontWeight:700,color:"var(--t)",marginBottom:4}}>{DRUGS[obWarningDrug]?.name}</div>
          <div style={{display:"inline-block",fontSize:11,padding:"3px 10px",borderRadius:10,background:`${DRUGS[obWarningDrug]?.riskColor}22`,color:DRUGS[obWarningDrug]?.riskColor,fontWeight:600}}>{DRUGS[obWarningDrug]?.risk}</div>
        </div>
        <div style={{padding:"10px 12px",background:"rgba(249,115,22,0.08)",borderRadius:10,border:"1px solid rgba(249,115,22,0.2)",marginBottom:14}}>
          <div style={{fontSize:12,color:"#fb923c",lineHeight:1.5}}>{DRUGS[obWarningDrug]?.warning?.replace("⚠️ ","")}</div>
        </div>
        <div style={{fontSize:11,fontWeight:600,color:"var(--t)",marginBottom:10}}>Numéros d'aide gratuits et anonymes</div>
        {[{name:"Drogues Info Service",num:"0 800 23 13 13",desc:"Gratuit, anonyme, 24h/24"},{name:"SAMU",num:"15",desc:"Urgence médicale"}].map(n=><a key={n.num} href={`tel:${n.num.replace(/\s/g,"")}`} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"var(--s)",borderRadius:11,marginBottom:8,border:"1px solid var(--b)",textDecoration:"none"}}>
          <div style={{minWidth:72,padding:"10px 8px",borderRadius:10,background:"rgba(249,115,22,0.15)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:11,fontWeight:800,color:"#fb923c",letterSpacing:".04em"}}>{n.num}</span>
          </div>
          <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:"var(--t)"}}>{n.name}</div><div style={{fontSize:10,color:"var(--t3)",marginTop:1}}>{n.desc}</div><div style={{fontSize:9,color:"#fb923c",fontWeight:600,marginTop:2}}>Appuyer pour appeler →</div></div>
        </a>)}
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button onClick={()=>setObWarningDrug(null)} style={{flex:1,padding:"11px",borderRadius:10,background:"var(--s)",border:"1px solid var(--b)",color:"var(--t3)",fontFamily:"inherit",fontWeight:600,fontSize:13,cursor:"pointer"}}>Annuler</button>
          <button onClick={()=>{setSelDrugs(p=>({...p,[obWarningDrug]:true}));setObWarningDrug(null);}} style={{flex:2,padding:"11px",borderRadius:10,background:"rgba(34,197,94,0.15)",border:"1.5px solid rgba(34,197,94,0.3)",color:"var(--green2)",fontFamily:"inherit",fontWeight:600,fontSize:13,cursor:"pointer"}}>Ajouter quand même</button>
        </div>
      </div>
    </div>}
    <div className="ob-progress">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        {step>0?<button onClick={prev} style={{background:"var(--s)",border:"1px solid var(--b)",borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"var(--t2)",fontSize:16}}>‹</button>:<div style={{width:28}}/>}
        <div style={{fontSize:10,color:"var(--t3)",fontWeight:600}}>{step+1} / {total}</div>
      </div>
      <div style={{height:3,background:"var(--s2)",borderRadius:2,overflow:"hidden"}}>
        <div style={{height:"100%",background:"var(--green)",borderRadius:2,width:`${((step+1)/total)*100}%`,transition:"width .4s ease"}}/>
      </div>
    </div>
    <div className="ob-body">{renderStep()}</div>
    <div className="ob-footer">
      {cur==="done"
        ?<button onClick={finish} style={{width:"100%",padding:"15px",borderRadius:13,background:"var(--green)",border:"none",color:"#fff",fontFamily:"inherit",fontWeight:700,fontSize:16,cursor:"pointer"}}>Commencer →</button>
        :<button onClick={next} disabled={!canNext} style={{width:"100%",padding:"14px",borderRadius:13,background:canNext?"rgba(34,197,94,0.15)":"var(--s)",border:canNext?"1.5px solid rgba(34,197,94,0.3)":"1.5px solid var(--b)",color:canNext?"var(--green2)":"var(--t3)",fontFamily:"inherit",fontWeight:600,fontSize:14,cursor:canNext?"pointer":"default",transition:"all .2s"}}>Continuer</button>}
    </div>
  </div>;
}

// ── MainApp — tous les hooks ici, zéro return conditionnel ────────────────────
function MainApp(){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [data,setData]=useState(()=>ld(ST,{}));
  const [goals,setGoals]=useState(()=>ld(GT,{target:20,notifOn:false,notifTime:"22:00",cigPerDay:20,cigPackCost:10,jointsPerDay:1,weedGPerJoint:0.3,weedGCost:15}));
  const [act,setAct]=useState(()=>ld(DT,DEF_ACTIVE));
  const [profile,setProfile]=useState(()=>ld(PT,{loggedIn:false,name:"",photo:null,provider:null}));
  const [widgets,setWidgets]=useState(()=>ld(WT,DEF_WIDGETS));
  const [tab,setTab]=useState("cal");
  const [calView,setCalView]=useState("month");
  const [weekOff,setWeekOff]=useState(0);
  const [modal,setModal]=useState(null);
  const [bop,setBop]=useState(null);
  const [calKey,setCalKey]=useState(0);
  const [expand,setExpand]=useState(null);
  const [showProfile,setShowProfile]=useState(false);
  const [showWidgets,setShowWidgets]=useState(false);
  const [showLevel,setShowLevel]=useState(false);
  const [pulse,setPulse]=useState(false);
  const [showSevrage,setShowSevrage]=useState(false);
  const prevStreak=useRef(0);
  const sevrageShown=useRef(ld('ht_sevrage_shown',false));
  const [helpDrug,setHelpDrug]=useState(null);

  useEffect(()=>{sv(ST,data);},[data]);
  useEffect(()=>{sv(GT,goals);},[goals]);
  useEffect(()=>{sv(DT,act);},[act]);
  useEffect(()=>{sv(PT,profile);},[profile]);
  useEffect(()=>{sv(WT,widgets);},[widgets]);

  const aList=useMemo(()=>Object.keys(act).filter(k=>act[k]),[act]);
  const dCount=dIn(year,month),offset=fOff(year,month);
  const entries=useMemo(()=>Array.from({length:dCount},(_,i)=>{const e=data[dk(year,month,i+1)]||null;return{d:i+1,e,clean:isClean(e,act)};}),[data,year,month,dCount,act]);
  const logged=entries.filter(x=>x.e?.logged).length;
  const nClean=entries.filter(x=>x.clean).length;
  const pct=logged?Math.round((nClean/logged)*100):0;
  const totals=useMemo(()=>{const t={};aList.forEach(k=>{t[k]=entries.reduce((s,x)=>s+(x.e?.[k]||0),0);});return t;},[entries,aList]);
  const weeklyData=useMemo(()=>{const wks=[];for(let w=0;w<5;w++){const start=w*7+1,end=Math.min(start+6,dCount);if(start>dCount)break;const we=entries.filter(x=>x.d>=start&&x.d<=end);const wk={clean:we.filter(x=>x.clean).length};aList.forEach(k=>{wk[k]=we.reduce((s,x)=>s+(x.e?.[k]||0),0);});wks.push(wk);}return wks;},[entries,dCount,aList]);
  const [streak,longest]=useMemo(()=>{
    let s=0,cur=new Date(today);
    while(true){const k=dk(cur.getFullYear(),cur.getMonth(),cur.getDate());if(isClean(data[k],act)){s++;cur.setDate(cur.getDate()-1);}else break;}
    let lg=0,run=0,pd=null;
    for(const k of Object.keys(data).sort()){if(isClean(data[k],act)){const d=new Date(k);if(pd&&(d-pd)/86400000===1){run++;}else{run=1;}lg=Math.max(lg,run);pd=d;}else{run=0;pd=null;}}
    return[s,lg];
  },[data,act]);
  useEffect(()=>{
    if(streak>prevStreak.current){
      setPulse(true);
      setTimeout(()=>setPulse(false),600);
      // Vérifier si sevrage complet atteint
      const active=Object.keys(act).filter(k=>act[k]);
      if(active.length>0&&!sevrageShown.current){
        const maxDays=Math.max(...active.map(k=>SEV[k]||90));
        if(streak>=maxDays){
          setShowSevrage(true);
          sevrageShown.current=true;
          sv('ht_sevrage_shown',true);
        }
      }
    }
    prevStreak.current=streak;
  },[streak,act]);
  const sc=score(streak,longest,pct,nClean,dCount,logged,act);
  const scColor=sc>=70?"#22c55e":sc>=40?"#f97316":"#ef4444";
  const lv=getLevel(streak,act);
  const badges=useMemo(()=>calcBadges(data,act),[data,act]);
  const earnedCount=badges.filter(b=>b.earned).length;
  const allLogged=Object.values(data).filter(e=>e?.logged).length;
  const money=useMemo(()=>calcMoney(entries,goals,act),[entries,goals,act]);
  const spark=useMemo(()=>Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=dk(d.getFullYear(),d.getMonth(),d.getDate());
    const e=data[k],cl=isClean(e,act);
    const tot=e?aList.reduce((s,dr)=>s+(e[dr]||0),0):0;
    const ms=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
    return{v:cl?3:tot===0?2:tot<=2?1:0,color:cl?"#22c55e":tot===0?"var(--t3)":"#ef4444",label:`${d.getDate()} ${ms[d.getMonth()]} — ${cl?"Clean":tot===0?"Non renseigné":tot+" prise(s)"}`};
  }),[data,act,aList]);

  const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=dCount;d++)cells.push(d);while(cells.length%7!==0)cells.push(null);
  function getWD(off){const base=new Date(today);const dow=base.getDay()===0?6:base.getDay()-1;base.setDate(base.getDate()-dow+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return{date:d,key:dk(d.getFullYear(),d.getMonth(),d.getDate())};});}
  const weekDays=getWD(weekOff);
  const prevM=useCallback(()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);setCalKey(k=>k+1);},[month]);
  const nextM=useCallback(()=>{const nm=month===11?0:month+1;const ny=month===11?year+1:year;if(ny>today.getFullYear()||(ny===today.getFullYear()&&nm>today.getMonth()))return;if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);setCalKey(k=>k+1);},[month,year]);
  const mSwipe=useSwipe(nextM,prevM);
  const wSwipe=useSwipe(()=>setWeekOff(w=>w+1),()=>setWeekOff(w=>w-1));
  const ySwipe=useSwipe(()=>setYear(y=>Math.min(y+1,today.getFullYear())),()=>setYear(y=>y-1));
  function saveEntry(key,d){setData(prev=>({...prev,[key]:d}));setBop(parseInt(key.split("-")[2]));setTimeout(()=>setBop(null),450);}
  function clearEntry(key){setData(prev=>{const n={...prev};delete n[key];return n;});}

  const riskOrder={"Extrême":0,"Très élevé":1,"Élevé":2,"Modéré":3,"Faible":4};
  const sortedDrugs=Object.entries(DRUGS).sort((a,b)=>(riskOrder[a[1].risk]||9)-(riskOrder[b[1].risk]||9));
  const enabledW=widgets.filter(w=>w.enabled);

  return<div className="shell">
    {/* Header */}
    <div className="hdr">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div>
          <div style={{fontSize:9,letterSpacing:".15em",color:"var(--t3)",textTransform:"uppercase",fontWeight:600}}>Mon parcours</div>
          <h1 style={{fontSize:18,fontWeight:700,color:"var(--t)",lineHeight:1.1,letterSpacing:"-.02em"}}>Habit Tracker{profile.name?` · ${profile.name}`:""}</h1>
        </div>
        <button onClick={()=>setShowProfile(true)} style={{width:34,height:34,borderRadius:"50%",background:"var(--s)",border:"1px solid var(--b)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,color:"var(--t2)"}}>
          {profile.photo?<img src={profile.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<IcUser/>}
        </button>
      </div>
    </div>

    <div className="content">

      {/* ══ PARCOURS ══ */}
      {tab==="cal"&&<div className="tc">
        {/* Score card */}
        <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))",cursor:"pointer"}} onClick={()=>setShowLevel(true)}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Indice de progression</div>
              <div style={{fontSize:48,fontWeight:700,color:scColor,lineHeight:1,letterSpacing:"-.02em"}}>{sc}<span style={{fontSize:18}}>/100</span></div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                <span className="level-badge" style={{background:lv.color+"22",color:lv.color,border:`1px solid ${lv.color}44`}}>Niv.{lv.n} · {lv.label}</span>
                <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="var(--t3)" strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
              <div style={{marginTop:10}}><Bar pct={sc} color={`linear-gradient(90deg,${scColor},${scColor}88)`} thick/></div>
            </div>
            <div style={{paddingLeft:16}}><Flame streak={streak}/></div>
          </div>
        </div>

        {/* Cal nav */}
        <div className="nav">
          <button className="nbtn" onClick={calView==="year"?()=>setYear(y=>y-1):calView==="week"?()=>setWeekOff(w=>w-1):prevM}>‹</button>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:13,fontWeight:600}}>{calView==="year"?year:calView==="week"?`${weekDays[0].date.getDate()}–${weekDays[6].date.getDate()} ${MONTHS_S[weekDays[3].date.getMonth()]} ${weekDays[3].date.getFullYear()}`:`${MONTHS[month]} ${year}`}</span>
            <div className="vpill">
              <button className={`vbtn${calView==="month"?" on":""}`} onClick={()=>setCalView("month")}><IcMo/>Mois</button>
              <button className={`vbtn${calView==="week"?" on":""}`} onClick={()=>setCalView("week")}><IcSe/>Sem.</button>
              <button className={`vbtn${calView==="year"?" on":""}`} onClick={()=>setCalView("year")}><IcYe/>An</button>
            </div>
          </div>
          <button className="nbtn" onClick={calView==="year"?()=>setYear(y=>Math.min(y+1,today.getFullYear())):calView==="week"?()=>setWeekOff(w=>w+1):nextM}>›</button>
        </div>

        {calView==="month"&&<div ref={mSwipe} style={{touchAction:"pan-y"}}>
          <div className="cal-hdr">{DAYS.map(d=><div key={d} className="cdl">{d}</div>)}</div>
          <div className="cal-grid" key={calKey}>
            {cells.map((d,i)=>{if(!d)return<div key={`e${i}`}/>;const e=data[dk(year,month,d)]||null,col=dColor(e,act);const iT=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();const future=isF(year,month,d);
            return<div key={d} className={`day${iT?" td":""}${bop===d?" bop":""}${future?" future":""}`} style={{background:col?col+"22":"var(--s)",borderColor:col||(iT?"rgba(34,197,94,0.6)":"transparent"),color:col||"var(--t3)",animationDuration:`${Math.min(i*14,260)+160}ms`}} onClick={()=>!future&&setModal({y:year,m:month,d})}>
              <span style={{fontSize:11,fontWeight:iT?700:500}}>{d}</span>
              {e&&!future&&<span style={{fontSize:8,marginTop:1}}>{dEmoji(e,act)}</span>}
              {e?.mood!=null&&!future&&<span style={{position:"absolute",bottom:2,right:2,fontSize:7}}>{MOODS[e.mood]?.e}</span>}
              {e?.note&&!future&&<div className="dot"/>}
            </div>;})}
          </div>
        </div>}

        {calView==="week"&&<div ref={wSwipe} style={{touchAction:"pan-y"}}>
          <div className="week-grid">
            {weekDays.map(({date,key},i)=>{const e=data[key]||null,col=dColor(e,act);const iT=date.toDateString()===today.toDateString();const future=date>TODAY;
            return<div key={key} className={`wday${iT?" td":""}${future?" future":""}`} style={{background:col?col+"18":"var(--s)",borderColor:col||(iT?"rgba(34,197,94,0.6)":"transparent")}} onClick={()=>!future&&setModal({y:date.getFullYear(),m:date.getMonth(),d:date.getDate()})}>
              <div style={{fontSize:9,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",marginBottom:2}}>{DAYS_S[i]}</div>
              <div style={{fontSize:14,fontWeight:700,color:col||(iT?"var(--green2)":"var(--t)"),marginBottom:2}}>{date.getDate()}</div>
              <div style={{fontSize:9,color:"var(--t3)",marginBottom:2}}>{MONTHS_S[date.getMonth()]}</div>
              <div style={{fontSize:13}}>{e&&!future?dEmoji(e,act):"·"}</div>
            </div>;})}
          </div>
        </div>}

        {calView==="year"&&<div ref={ySwipe} style={{touchAction:"pan-y"}}>
          <div className="year-grid">
            {Array.from({length:12},(_,mi)=>{const dim=dIn(year,mi),off2=fOff(year,mi);const dots=[];for(let i=0;i<off2;i++)dots.push(null);for(let d=1;d<=dim;d++)dots.push(d);const ok=year<today.getFullYear()||(year===today.getFullYear()&&mi<=today.getMonth());
            return<div key={mi} className="ym-card" style={{opacity:ok?1:0.3,cursor:ok?"pointer":"default"}} onClick={()=>ok&&(setMonth(mi),setCalView("month"))}>
              <div className="ym-name">{MONTHS_S[mi]}</div>
              <div className="ym-dots">{dots.slice(0,35).map((d,i)=>{const e=d?data[dk(year,mi,d)]||null:null;const col=e?dColor(e,act):null;const iT=d&&d===today.getDate()&&mi===today.getMonth()&&year===today.getFullYear();const future=d&&isF(year,mi,d);return<div key={i} className="yd" style={{background:future?"transparent":col?col+"cc":iT?"rgba(34,197,94,0.4)":"var(--s2)"}}/>;})}
              </div>
            </div>;})}
          </div>
        </div>}

        <div className="leg">
          <div className="li"><div className="ld" style={{background:"#22c55e"}}/>Clean</div>
          {aList.map(k=><div key={k} className="li"><div className="ld" style={{background:DRUGS[k]?.color}}/>{DRUGS[k]?.name}</div>)}
        </div>
        <div className="ss" style={{marginTop:10}}>
          <div className="m"><div className="v" style={{color:"#22c55e"}}>{nClean}</div><div className="l">jours clean</div></div>
          <div className="m"><div className={`v${pulse?" pulse":""}`} style={{color:"var(--green2)",display:"inline-block"}}>{streak}j</div><div className="l">streak</div></div>
          <div className="m"><div className="v" style={{color:"#a3e635"}}>{pct}%</div><div className="l">taux</div></div>
        </div>

        {/* Widgets */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:600,color:"var(--t2)"}}>Widgets</div>
          <button onClick={()=>setShowWidgets(true)} style={{background:"var(--s)",border:"1px solid var(--b)",borderRadius:8,padding:"4px 10px",color:"var(--t3)",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Personnaliser</button>
        </div>

    </div>}
    {helpDrug&&<div className="mo" onClick={()=>setHelpDrug(null)}>
      <div className="mb" onClick={e=>e.stopPropagation()}>
        <div className="mh" onClick={()=>setHelpDrug(null)}/>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:32,marginBottom:8}}>{DRUGS[helpDrug]?.emoji}</div>
          <div style={{fontSize:16,fontWeight:700,color:"var(--t)",marginBottom:4}}>{DRUGS[helpDrug]?.name}</div>
          <div style={{display:"inline-block",fontSize:11,padding:"3px 10px",borderRadius:10,background:`${DRUGS[helpDrug]?.riskColor}22`,color:DRUGS[helpDrug]?.riskColor,fontWeight:600,border:`1px solid ${DRUGS[helpDrug]?.riskColor}44`}}>{DRUGS[helpDrug]?.risk}</div>
        </div>
        {DRUGS[helpDrug]?.warning&&<div style={{padding:"10px 12px",background:"rgba(249,115,22,0.08)",borderRadius:10,border:"1px solid rgba(249,115,22,0.2)",marginBottom:14}}>
          <div style={{fontSize:12,color:"#fb923c",lineHeight:1.5}}>{DRUGS[helpDrug].warning.replace("⚠️ ","")}</div>
        </div>}
        <div style={{fontSize:11,fontWeight:600,color:"var(--t)",marginBottom:10}}>Numéros d'aide disponibles</div>
        {[{name:"Drogues Info Service",num:"0 800 23 13 13",desc:"Gratuit, anonyme, 24h/24"},{name:"SAMU",num:"15",desc:"Urgence médicale"}].map(n=><div key={n.num} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"var(--s)",borderRadius:11,marginBottom:8,border:"1px solid var(--b)"}}>
          <div style={{width:44,height:44,borderRadius:10,background:"rgba(249,115,22,0.15)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <span style={{fontSize:12,fontWeight:700,color:"#fb923c"}}>{n.num}</span>
          </div>
          <div><div style={{fontSize:12,fontWeight:600,color:"var(--t)"}}>{n.name}</div><div style={{fontSize:10,color:"var(--t3)",marginTop:1}}>{n.desc}</div></div>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <button onClick={()=>setHelpDrug(null)} style={{flex:1,padding:"11px",borderRadius:10,background:"var(--s)",border:"1px solid var(--b)",color:"var(--t3)",fontFamily:"inherit",fontWeight:600,fontSize:13,cursor:"pointer"}}>Annuler</button>
          <button onClick={()=>{setAct(prev=>({...prev,[helpDrug]:!prev[helpDrug]}));setHelpDrug(null);}} style={{flex:2,padding:"11px",borderRadius:10,background:"rgba(34,197,94,0.15)",border:"1.5px solid rgba(34,197,94,0.3)",color:"var(--green2)",fontFamily:"inherit",fontWeight:600,fontSize:13,cursor:"pointer"}}>Ajouter quand même</button>
        </div>

        </div>
      </div>}
    </div>}
    {showLevel&&<ScoreLevelModal sc={sc} streak={streak} act={act} onClose={()=>setShowLevel(false)}/>}
    {showProfile&&<ProfileModal profile={profile} setProfile={setProfile} onClose={()=>setShowProfile(false)}/>}
    {showWidgets&&<WidgetMgr widgets={widgets} setWidgets={setWidgets} onClose={()=>setShowWidgets(false)}/>}
    {modal&&<DayModal modal={modal} data={data} act={act} onSave={saveEntry} onClear={clearEntry} onClose={()=>setModal(null)}/>}
  </div>;
}

// ── App wrapper ───────────────────────────────────────────────────────────────
function App(){
  const [onboarded,setOnboarded]=useState(()=>ld(OT,false));
  const [activeDrugs,setActiveDrugs]=useState(()=>ld(DT,DEF_ACTIVE));
  const [goals,setGoals]=useState(()=>ld(GT,{target:20,notifOn:false,notifTime:"22:00",cigPerDay:20,cigPackCost:10,jointsPerDay:1,weedGPerJoint:0.3,weedGCost:15}));
  const [profile,setProfile]=useState(()=>ld(PT,{loggedIn:false,name:"",photo:null,provider:null}));

  function completeOnboarding({name,age,photo,activeDrugs:ad,goals:g}){
    const newProfile={...profile,name,age,photo};
    sv(DT,ad); sv(GT,g); sv(PT,newProfile); sv(OT,true);
    setActiveDrugs(ad); setGoals(g); setProfile(newProfile); setOnboarded(true);
  }

  if(!onboarded)return<Onboarding onComplete={completeOnboarding}/>;
  return<MainApp/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
